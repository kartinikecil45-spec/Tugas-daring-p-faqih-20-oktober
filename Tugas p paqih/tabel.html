<!DOCTYPE html>
<html>
<head>
    <title>Tugas Tabel</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 30px;
            font-size: 18px;
        }
        table {
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 15px;
            text-align: center;
        }
        /* Mengatur agar teks nama rata kiri seperti di gambar */
        .teks-kiri {
            text-align: left; 
        }
    </style>
</head>
<body>

    <!-- Teks soal di atas tabel -->

    <table>
        <!-- Baris 1: Judul NIS, Nama, dan Bulan -->
        <tr>
            <th rowspan="3">NIS</th>
            <th rowspan="3">Nama</th>
            <th colspan="9">Bulan</th>
        </tr>
        
        <!-- Baris 2: Nama Bulan -->
        <tr>
            <th colspan="3">Januari</th>
            <th colspan="3">Februari</th>
            <th colspan="3">Maret</th>
        </tr>
        
        <!-- Baris 3: Keterangan S, I, A -->
        <tr>
            <th>S</th><th>I</th><th>A</th>
            <th>S</th><th>I</th><th>A</th>
            <th>S</th><th>I</th><th>A</th>
        </tr>
        
        <!-- Baris 4: Data 1 (Asli) -->
        <tr>
            <td>111</td>
            <td class="teks-kiri">Zulkarnaen</td>
            <td>0</td><td>2</td><td>0</td>
            <td>0</td><td>0</td><td>0</td>
            <td>0</td><td>1</td><td>0</td>
        </tr>
        
        <!-- Baris 5: Data 2 (Asli) -->
        <tr>
            <td>112</td>
            <td class="teks-kiri">Zulkifli</td>
            <td>10</td><td>2</td><td>3</td>
            <td>21</td><td>9</td><td>0</td>
            <td>20</td><td>30</td><td>2</td>
        </tr>

        <!-- Baris 6: Data 3 (Tambahan) -->
        <tr>
            <td>113</td>
            <td class="teks-kiri">Ahmad Faisal</td>
            <td>1</td><td>0</td><td>0</td>
            <td>2</td><td>1</td><td>0</td>
            <td>0</td><td>0</td><td>0</td>
        </tr>

        <!-- Baris 7: Data 4 (Tambahan) -->
        <tr>
            <td>114</td>
            <td class="teks-kiri">Siti Nurhaliza</td>
            <td>0</td><td>0</td><td>0</td>
            <td>0</td><td>0</td><td>0</td>
            <td>1</td><td>0</td><td>0</td>
        </tr>

        <!-- Baris 8: Data 5 (Tambahan) -->
        <tr>
            <td>115</td>
            <td class="teks-kiri">Budi Santoso</td>
            <td>0</td><td>1</td><td>2</td>
            <td>0</td><td>0</td><td>0</td>
            <td>0</td><td>0</td><td>1</td>
        </tr>
    </table>

</body>
</html>
